<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="%VITE_APP_PRIMARY_COLOR%" />
    <meta name="app-build-id" content="%VITE_BUILD_ID%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_SHORT_NAME%" />
    <title>%VITE_APP_NAME%</title>
    <meta name="description" content="%VITE_APP_NAME% - %VITE_APP_TAGLINE%" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_APP_NAME%" />
    <meta property="og:description" content="%VITE_APP_NAME% - %VITE_APP_TAGLINE%" />
    <meta property="og:image" content="%VITE_APP_LOGO%" />
    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="%VITE_APP_NAME%" />
    <meta property="twitter:description" content="%VITE_APP_NAME% - %VITE_APP_TAGLINE%" />
    <meta property="twitter:image" content="%VITE_APP_LOGO%" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body style="--brand-primary: %VITE_APP_PRIMARY_COLOR%">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
